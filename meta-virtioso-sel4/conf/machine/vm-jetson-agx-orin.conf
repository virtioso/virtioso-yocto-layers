# VM guest machine for Jetson AGX Orin running under seL4 hypervisor
#
# Inherits kernel and tuning from jetson-agx-orin-devkit but removes
# the Tegra flash machinery (not needed for VM guests).

# Machine overrides - least to most specific
MACHINEOVERRIDES = "jetson-agx-orin-devkit:${MACHINE}"

require include/sel4-vm.inc
require conf/machine/jetson-agx-orin-devkit.conf

# VM guests use virtio-console (hvc0), not physical TCU
SERIAL_CONSOLES = "115200;hvc0"

# Simple image types for VM guests - no tegraflash
IMAGE_FSTYPES = "ext4 tar.bz2 cpio.gz"

# Tegra class computes IMAGE_ROOTFS_SIZE from ROOTFSPART_SIZE (29GB flash partition)
# For VM guests, set to 0 so Yocto calculates from actual rootfs size
IMAGE_ROOTFS_SIZE = "0"

# No Tegra initramfs signing (we use simple cpio.gz)
TEGRA_INITRAMFS_FSTYPES = ""
INITRAMFS_FSTYPES = "cpio.gz"

# Kernel command line for VM - simpler than bare metal
KERNEL_ARGS = "console=hvc0 root=/dev/vda rw"
