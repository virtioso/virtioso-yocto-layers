# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend ${LAYERDIR}/images/*.bb"

BBFILE_COLLECTIONS += "meta-virtioso-sel4"
BBFILE_PATTERN_meta-virtioso-sel4 := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-virtioso-sel4 = "30"

LAYERSERIES_COMPAT_meta-virtioso-sel4 = "walnascar wrynose"
LAYERDEPENDS_meta-virtioso-sel4 = "meta-virtioso"

# Local source policy (single source of truth for setup and BitBake guard).
VIRTIOSO_LOCAL_SOURCES_DIR ?= "${@os.path.abspath(os.path.join(d.getVar('TOPDIR'), '..', '..', 'sources'))}"
VIRTIOSO_QEMU_REPO_DIR ?= "qemu"
YOCTO_REQUIRED_CLEAN_REPOS_BASE = "virtioso-contracts kmod-sel4-virt kmod-vio-trace sel4-linux-kernel-support"
# qemu is listed separately: a consumer that fetches qemu at a pinned revision
# instead of building the local checkout sets this empty, and the guard's
# submodule check for it does not apply, without restating the base list.
YOCTO_REQUIRED_CLEAN_QEMU ?= "${VIRTIOSO_QEMU_REPO_DIR}"
YOCTO_REQUIRED_CLEAN_REPOS_EXTRA ?= ""
YOCTO_REQUIRED_CLEAN_REPOS = "${YOCTO_REQUIRED_CLEAN_REPOS_BASE} ${YOCTO_REQUIRED_CLEAN_QEMU} ${YOCTO_REQUIRED_CLEAN_REPOS_EXTRA}"

INHERIT += "virtioso-sources-guard"

# The dynamic-layers directory hosts the extensions and layer specific
# modifications.
#
# The .bbappend and .bb files are included if the respective layer
# collection is available.
BBFILES += "${@' '.join('${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bbappend' % layer \
               for layer in BBFILE_COLLECTIONS.split())}"
BBFILES += "${@' '.join('${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bb' % layer \
               for layer in BBFILE_COLLECTIONS.split())}"

BBFILES_DYNAMIC += " \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bbappend \
    tegra:${LAYERDIR}/dynamic-layers/tegra/*/*/*.bb \
    tegra:${LAYERDIR}/dynamic-layers/tegra/*/*/*.bbappend \
"
