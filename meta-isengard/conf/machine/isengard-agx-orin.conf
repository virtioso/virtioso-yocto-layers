# Isengard bare-metal Linux machine for Jetson AGX Orin
# Runs directly on hardware, not as a seL4 VM guest.

MACHINEOVERRIDES = "jetson-agx-orin-devkit:${MACHINE}"

require conf/machine/jetson-agx-orin-devkit.conf

# Physical TCU serial, not virtio-console (hvc0 is for seL4 VM guests)
SERIAL_CONSOLES = "115200;ttyTCU0"

# Standard image types; no tegraflash signing for EFI-uploaded images
IMAGE_FSTYPES = "ext4 cpio.gz"
IMAGE_ROOTFS_SIZE = "0"

# No Tegra initramfs signing — using plain cpio.gz
TEGRA_INITRAMFS_FSTYPES = ""
INITRAMFS_FSTYPES = "cpio.gz"

# Embed isengard rootfs into kernel at compile time (CONFIG_INITRAMFS_SOURCE).
# The resulting Image is a self-contained EFI stub executable that UEFI can
# boot without a separate initrd.
INITRAMFS_IMAGE = "isengard-image-native"
INITRAMFS_IMAGE_BUNDLE = "1"

# l4t-launcher-extlinux depends on the kernel deploy, which with
# INITRAMFS_IMAGE_BUNDLE=1 creates a circular dependency (kernel deploy
# waits for image, image installs l4t-launcher-extlinux via packagegroup-core-boot,
# l4t-launcher-extlinux waits for kernel deploy). We boot via EFI bundle, not
# extlinux, so this package is not needed.
BAD_RECOMMENDATIONS += "l4t-launcher-extlinux"

# mttcan and SocketCAN kernel modules
MACHINE_EXTRA_RRECOMMENDS += " \
    kernel-module-mttcan \
    kernel-module-can \
    kernel-module-can-dev \
    kernel-module-can-raw \
"
